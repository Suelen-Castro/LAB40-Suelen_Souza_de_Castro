name: CI - LAB40 Feature 06

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (Lint)
        run: npm run lint

      - name: Executar testes automatizados
        run: npm test

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Executar Smoke Test
        run: npm run test:smoke

      - name: Build da imagem Docker
        run: docker build -t lab40:feature06 .

      - name: Testar container Docker (/health e Feature 06)
        run: |
          docker run -d --name lab40-ci-test -p 3000:3000 lab40:feature06
          sleep 3
          curl --fail http://localhost:3000/health
          curl --fail -X POST http://localhost:3000/api/features/6 \
            -H "Content-Type: application/json" \
            -d '{"valores":[7,8,9]}'
          docker stop lab40-ci-test
          docker rm lab40-ci-test
